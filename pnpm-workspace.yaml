# Supply-chain policy taken from Saha: no package published in the last seven days, and dependency
# build scripts run only for the packages listed here.
minimumReleaseAge: 10080
strictDepBuilds: true
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  unrs-resolver: true
overrides:
  miniflare>sharp: 0.35.4
