# DigitalOcean App Platform spec for the SYNTHETIC demonstration host. Create the app from this file (doctl apps create --spec .do/app.yaml,
# or paste it into "Edit App Spec"), then set the three REPLACE_ME values in the console as encrypted values before the first deploy.
# The launcher refuses to start while any of them is still REPLACE_ME, so a deploy made too early fails; it does not run open.
# No region is set: choose one in the console. Costs and limits: modules/hosting/STATUS.md.
name: aplyd-demo
services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: nakul175/aplyd-msme-platform
      branch: main
      deploy_on_push: false
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    health_check:
      http_path: /healthz
      initial_delay_seconds: 60
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: APLYD_ENV
        value: synthetic
        scope: RUN_TIME
      - key: SESSION_SECRET
        value: REPLACE_ME
        type: SECRET
        scope: RUN_TIME
      - key: DEMO_USER
        value: REPLACE_ME
        type: SECRET
        scope: RUN_TIME
      - key: DEMO_PASSWORD
        value: REPLACE_ME
        type: SECRET
        scope: RUN_TIME
