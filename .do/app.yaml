# DigitalOcean App Platform spec for the SYNTHETIC demonstration host. Create the app from this file (doctl apps create --spec .do/app.yaml,
# or paste it into "Edit App Spec"), then set the three REPLACE_ME values in the console as encrypted values before the first deploy.
# The launcher refuses to start while any of them is still REPLACE_ME, so a deploy made too early fails; it does not run open.
# No region is set: choose one in the console (the live app is in Bangalore; read the exact region value from the live app's own spec).
# This file is a template for a NEW app. Do not apply it to the live app (doctl apps update --spec): the three REPLACE_ME values would replace the live
# encrypted ones. To change the live app, read its spec (doctl apps spec get <app id>), change that, and send it back; see docs/ops/RUNBOOK.md.
# Costs and limits: modules/hosting/STATUS.md.
name: aplyd-demo
services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: nakul175/aplyd-msme-platform
      branch: main
      deploy_on_push: false
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    health_check:
      http_path: /healthz
      initial_delay_seconds: 60
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: APLYD_ENV
        value: synthetic
        scope: RUN_TIME
      # The demonstration cast and the presenter's script at /demo (the live app has this on).
      - key: APLYD_DEMO
        value: "true"
        scope: RUN_TIME
      # The git commit being run, shown by /healthz. App Platform fills the bindable variable at run time (not at build time, for a Dockerfile).
      - key: APLYD_COMMIT
        value: ${_self.COMMIT_HASH}
        scope: RUN_TIME
      - key: SESSION_SECRET
        value: REPLACE_ME
        type: SECRET
        scope: RUN_TIME
      - key: DEMO_USER
        value: REPLACE_ME
        type: SECRET
        scope: RUN_TIME
      - key: DEMO_PASSWORD
        value: REPLACE_ME
        type: SECRET
        scope: RUN_TIME
