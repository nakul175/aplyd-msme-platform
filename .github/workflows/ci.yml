# Engineering checks on synthetic data only. No secrets, no hosted database, no deployment.
name: engineering-checks
on:
  pull_request:
    # A pull request that changes only Markdown or docs/ runs documentation-checks instead.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # The merge result is checked too, so a direct commit or a merge that differs from the reviewed branch is not unchecked.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engineering-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    # The guard took 600 to 672 seconds of a 633 to 704 second job on 4 and 5 October (67 suites); every suite added since lengthens it. Each suite has its own
    # limit in scripts/test.mjs (10 to 15 minutes), so a hang is still stopped; this only keeps a slow but passing run from being cancelled and paid for twice.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test catalogue
        run: node scripts/test.mjs --check-catalogue
      - name: Install pinned dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      # The browser layer drives the Google Chrome that the runner image already has, through playwright-core. Nothing is
      # downloaded. If Chrome is missing this step fails, and so does the layer; it never skips.
      - name: Show the browser the browser layer will use
        run: google-chrome --version
      - name: All layers with the regression guard
        run: node scripts/test.mjs pr --guard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-summary
          path: reports/summary.json
